<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppManager</title><link rel="stylesheet" href="/app.css"></head>
<body><main><header><div><p class="eyebrow">CONOCIMIENTO DE REPOSITORIOS</p><h1>AppManager</h1><p>Sincroniza y digiere commits con GitHub y LM Studio.</p></div><button id="syncButton">Sincronizar ahora</button></header>
<section class="card"><h2>Estado</h2><p id="runStatus">Cargando…</p><p id="syncActivity" class="activity">Esperando estado de sincronización…</p><div id="repositories" class="repositories"></div></section>
<section class="card"><h2>Configuración</h2><form id="configForm"><label>Importar desde<input id="importSince" type="date" required></label><label>Modelo LM Studio<select id="model"><option value="">Selecciona un modelo</option></select></label><label>Frecuencia (minutos)<input id="interval" type="number" min="1" max="1440" required></label><label>Idioma<select id="language"><option value="es">Español</option><option value="en">English</option></select></label><fieldset><legend>Repositorios a sincronizar</legend><p class="muted">Disponibles para el token actual de GitHub.</p><div id="repositoryChoices" class="repository-choices"></div></fieldset><button type="submit">Guardar configuración</button><span id="formStatus"></span></form></section>
</main><script src="/app.js"></script></body></html>
